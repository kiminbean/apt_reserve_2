<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=0,maximum-scale=10,user-scalable=yes">
<meta name="format-detection" content="telephone=no">
<title>방문예약페이지 - 공지사항</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css">
<link rel="stylesheet" href="assets/mobile.css">
<link rel="stylesheet" href="assets/notice/style.css">
<link rel="stylesheet" href="assets/common.css">
<link rel="stylesheet" href="assets/layout.css">
</head>
<body>

<div id="wrap">
	<div id="container">
		<div class="gnb">
			<div class="logo">
				<a href="index.html"><i class="fas fa-history"></i> 방문<span>예약페이지</span></a>
			</div>
			<div class="tel">
				<h1><i class="fas fa-headset"></i> <span class="mb">예약관련문의 : </span><span>010-9338-0809</span></h1>
			</div>
		</div>

<form name="fboardlist" id="fboardlist" method="post">
<!-- 게시판 목록 시작 -->
<div id="bo_list">
    <div class="list_01">
        <ul>
            <li class="bo_notice">
                <div class="bo_cnt">
                    <div class="bo_cate_ico">
                        <strong class="notice_icon">공지</strong>
                    </div>
                    <a href="notice_view.html" class="bo_subject">
                        안녕하세요. 방문 예약 방법을 안내해드립니다.
                        <i class="fa fa-heart" aria-hidden="true"></i>
                    </a>
                </div>
                <div class="bo_info">
                    <span class="sound_only">작성자</span><span class="sv_member">사전예약</span>
                    <span class="bo_date"><i class="fa fa-clock-o" aria-hidden="true"></i> 06-16</span>
                    <span class="bo_view"><i class="fa fa-eye" aria-hidden="true"></i> 6,798<span class="sound_only">회</span></span>
                </div>
            </li>
        </ul>
    </div>
</div>
</form>
<!-- 페이지 -->
<div id="bo_list_total">
    <span>전체 1건</span>
    1 페이지
</div>
<fieldset id="bo_sch">
    <legend>게시물 검색</legend>
    <form name="fsearch" method="get">
    <label for="sfl" class="sound_only">검색대상</label>
    <select name="sfl" id="sfl">
        <option value="wr_subject">제목</option>
        <option value="wr_content">내용</option>
        <option value="wr_subject||wr_content">제목+내용</option>
        <option value="wr_name,1">글쓴이</option>
    </select>
    <input name="stx" value="" placeholder="검색어를 입력하세요" required id="stx" class="sch_input" size="15" maxlength="20">
    <button type="submit" value="검색" class="sch_btn"><i class="fa fa-search" aria-hidden="true"></i> <span class="sound_only">검색</span></button>
    </form>
</fieldset>
<!-- 게시판 목록 끝 -->

		<div class="ft">
			<div class="ft_logo">
				<img src="img/ft_logo.png" alt="logo">
			</div>
			<div class="ft_txt">
				<h1 class="ft_logo">방문예약페이지</h1>
				<p>APART RESERVATION SYSTEM</p>
			</div>
			<div class="adm_link">
				<a href="login.html">[관리자모드]</a>
			</div>
		</div>
	</div><!-- END container-->
</div><!-- END wrap-->

</body>
</html>
