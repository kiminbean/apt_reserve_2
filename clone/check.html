<script>
function getNext() {
    var f = document.forms.wzfrm;
    if (!f.user_nm.value) { alert("예약자명을 입력해주세요."); f.user_nm.focus(); return false; }
    if (!f.user_hp.value) { alert("핸드폰번호를 입력해주세요."); f.user_hp.focus(); return false; }
    return true;
}
</script>
